# Minimal NIC-style standalone core for a Lattice PCIe IP instantiated OUTSIDE of the core:
# single-lane endpoint + a single DMA channel, connected to the IP at the TLP level.
#
# NOTE: The User top level instantiates the Lattice PCIe IP and connects its vc_rx_*/vc_tx_* and
# u_*_link_up_o to the core's pcie_* ports (pcie_clk = the clock fed to clk_usr_i), and provides the
# configuration-space status read over ucfg -- see litepcie/phy/latticetlpphy.py.
# phy_bar0_size must match the BAR0 size the IP was generated with.

{
    # PHY ----------------------------------------------------------------------
    "phy"                     : "LATTICETLPPHY", # Type of PCIe PHY
    "phy_device"              : "LFD2NX-40",     # Type of Device
    "phy_pcie_data_width"     : 32,              # PCIe data_width (fixed, single-lane)
    "phy_data_width"          : 64,              # Bus data_width
    "phy_bar0_size"           : 0x40000,         # BAR0 size

    # Clocking -----------------------------------------------------------------
    "clk_freq"                : 125e6, # User Clk Freq (AXI MMAP/DMA)
    "clk_external"            : False, # Use external User provided Clk

    # Endpoint -----------------------------------------------------------------
    "ep_max_pending_requests" : 8,
    "ep_address_width"        : 32,

    # Control ------------------------------------------------------------------
    "ctrl"                    : False,

    # MMAP Master --------------------------------------------------------------
    "mmap"                    : False,

    # MMAP Slave ---------------------------------------------------------------
    "mmap_slave"              : False,

    # DMA channels -------------------------------------------------------------
    "dma_channels"            : 1,     # Number of DMA channels
    "dma_buffering"           : 8192,  # Buffering for each channel (in bytes)
    "dma_loopback"            : True,  # Enable DMA loopback capability (CSR layout expected by the kernel driver)
    "dma_synchronizer"        : False, # Enable DMA synchronizer capability
    "dma_monitor"             : False, # Enable DMA monitoring capability

    # MSI IRQs -----------------------------------------------------------------
    "msi_irqs"                : 4, # Number or MSI IRQs
}
